    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Manrope', sans-serif; }
        body { background: #f7faf9; color: #1a2b25; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

        .logo-main { font-size: 26px; font-weight: 900; color: #00317F; letter-spacing: 0.5px; }
        .code { font-size: 72px; font-weight: 900; color: #00317F; line-height: 1; margin-bottom: 8px; }
        h1 { font-size: 21px; font-weight: 900; color: #1a2b25; margin-bottom: 12px; }
        p { font-size: 15px; font-weight: 600; color: #4a5d55; line-height: 1.6; margin-bottom: 28px; }
        .btn { display: inline-block; background: #00a86b; color: #fff; text-decoration: none; padding: 14px 32px; border-radius: 10px; font-size: 15px; font-weight: 800; transition: background 0.2s; }
        .btn:hover { background: #008f5B; }
        .btn:focus-visible { outline: 3px solid #00317F; outline-offset: 2px; }
        .tel { display: block; margin-top: 20px; font-size: 14px; font-weight: 700; color: #00317F; text-decoration: none; }
    </style>
</head>
<body>
    <main class="box">

        <h1>Бундай саҳифа топилмади</h1>
        <p>Сиз қидирган саҳифа ўчирилган ёки манзил нотўғри ёзилган бўлиши мумкин.</p>

        <a href="/" class="btn">Бош саҳифага қайтиш</a>
        <a href="tel:+998712030408" class="tel">ёки қўнғироқ қилинг: +998 71 203-04-08</a>
